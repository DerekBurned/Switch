name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure Gradle memory
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.compiler.execution.strategy=in-process"
          } >> "$gradle_home/gradle.properties"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Add it under Settings > Secrets and variables > Actions (base64 of app/google-services.json)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Install signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set. Add the base64 of your ~/.android/debug.keystore so CI builds share the signature of your local builds."
            exit 1
          fi
          keystore_dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$keystore_dir"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_dir/debug.keystore"

      - name: Read version
        id: version
        run: |
          version_name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r')
          version_code=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::VERSION_NAME and VERSION_CODE must be set in gradle.properties."
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building $version_name ($version_code)"

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME ${{ steps.version.outputs.name }} in gradle.properties."
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK and AAB
        env:
          ORG_GRADLE_PROJECT_AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_AGORA_APP_ID" ]; then
            echo "::warning::AGORA_APP_ID secret is not set; calls will not work in this build."
          fi
          ./gradlew assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Switch-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Switch-${{ steps.version.outputs.name }}.aab"
          ls -l dist

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Upload build outputs
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Switch-${{ steps.version.outputs.name }}
          path: dist/
